  <title>Mis juegos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;

    a.juego {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 4px;

      color: inherit;
      text-decoration: none;
    }
    a.juego:last-of-type { border-bottom: 1px solid #2a2d33; }
    a.juego span:first-child { font-size: 20px; }
    a.juego span:last-child { color: #8b8f98; font-size: 14px; }
    a.juego:hover { background: #1c1f24; }
    a.juego:hover span:first-child { color: #6ea8ff; }
