<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Robot Arena - Versión 4</title>
    <!-- Carga del runtime oficial de CheerpJ 3 -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f141c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            margin-bottom: 15px;
            text-align: center;
        }

        .back-link {
            color: #4ac6ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 10px 0 0 0;
            font-size: 28px;
        }

        #container {
            width: 1100px;
            height: 720px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../" class="back-link">&larr; Volver al menú de versiones</a>
        <h1>Zombie Robot Arena - Versión 4</h1>
    </div>

    <!-- Contenedor donde CheerpJ renderiza la pantalla del juego (1100x720px) -->
    <div id="container"></div>

    <script>
        async function main() {
            // 1. Inicializar la máquina virtual de Java en el navegador
            await cheerpjInit();

            // 2. Crear la pantalla virtual dentro del div #container
            cheerpjCreateDisplay(1100, 720, document.getElementById("container"));

            // 3. Ejecutar el archivo .jar usando la ruta relativa del directorio V4
            await cheerpjRunJar("ZombieRobotArena_V4.jar");
        }

        main();
    </script>

</body>
</html>
