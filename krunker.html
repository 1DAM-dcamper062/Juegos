<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Krunker</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Impact, 'Arial Narrow', sans-serif;
            color: #eee;
            user-select: none
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .scr {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: radial-gradient(#1b2a1fcc, #050805f2);
            z-index: 5;
            text-align: center;
            padding: 20px
        }

        .hid {
            display: none
        }

        h1 {
            font-size: clamp(40px, 9vw, 96px);
            letter-spacing: .12em;
            color: #c8ff5a;
            text-shadow: 0 0 30px #7fb02088
        }

        h2 {
            font-size: 42px;
            letter-spacing: .1em;
            color: #c8ff5a
        }

        .sub {
            letter-spacing: .4em;
            color: #9ab;
            margin-bottom: 20px
        }

        button {
            font: inherit;
            font-size: 20px;
            letter-spacing: .2em;
            padding: 12px 40px;
            min-width: 260px;
            background: #0008;
            color: #eee;
            border: 2px solid #c8ff5a;
            cursor: pointer
        }

        button:hover {
            background: #c8ff5a;
            color: #111
        }

        #cards {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 16px 0
        }

        .card {
            width: 220px;
            padding: 18px;
            border: 2px solid #556;
            background: #0009;
            cursor: pointer
        }

        .card:hover {
            border-color: #c8ff5a
        }

        .card.lock {
            opacity: .4;
            cursor: not-allowed
        }

        .ctl {
            line-height: 1.9;
            font-family: Arial;
            font-size: 17px
        }

        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2
        }

        #cross {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 14px;
            height: 14px;
            margin: -7px;
            border: 2px solid #fffb;
            border-radius: 50%
        }

        #hm {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            margin: -17px;
            border: 3px solid #fff;
            transform: rotate(45deg);
            opacity: 0
        }

        #dmg {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 160px 40px #e00;
            opacity: 0
        }

        #scope {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 28%, #000 29%);
            display: none
        }

        #top {
            position: absolute;
            top: 16px;
            width: 100%;
            text-align: center;
            font-size: 26px;
            letter-spacing: .15em;
            text-shadow: 0 0 6px #000
        }

        #hp {
            position: absolute;
            left: 24px;
            bottom: 24px;
            width: 260px;
            height: 16px;
            border: 2px solid #fff8;
            background: #0008
        }

        #hpb {
            display: block;
            height: 100%;
            background: #7fdc3a
        }

        #ammo {
            position: absolute;
            right: 28px;
            bottom: 20px;
            text-align: right;
            font-size: 44px;
            text-shadow: 0 0 6px #000
        }

        #ammo small {
            display: block;
            font-size: 18px;
            color: #c8ff5a;
            letter-spacing: .1em
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hud" style="display:none">
        <div id="dmg"></div>
        <div id="scope"></div>
        <div id="cross"></div>
        <div id="hm"></div>
        <div id="top"></div>
        <div id="hp"><i id="hpb"></i></div>
        <div id="ammo"></div>
    </div>
    <div id="menu" class="scr">
        <h1>Krunker</h1>
        <p class="sub">A MATAR</p><button onclick="show('lv')">JUGAR</button><button
            onclick="show('ctl')">CONTROLES</button>
    </div>
    <div id="lv" class="scr hid">
        <h2>SELECCIONA MISIÓN</h2>
        <div id="cards"></div><button onclick="show('menu')">VOLVER</button>
    </div>
    <div id="ctl" class="scr hid">
        <h2>CONTROLES</h2>
        <p class="ctl">WASD mover · SHIFT correr · ESPACIO saltar<br>RATÓN apuntar · CLIC IZQ disparar · CLIC DCHO
            apuntar con mira<br>R recargar · 1-4 / RUEDA cambiar arma · ESC pausa</p><button
            onclick="show('menu')">VOLVER</button>
    </div>
    <div id="pause" class="scr hid">
        <h2>PAUSA</h2><button id="res">CONTINUAR</button><button onclick="show('menu')">SALIR AL MENÚ</button>
    </div>
    <div id="end" class="scr hid">
        <h2 id="et"></h2>
        <p id="ep" class="ctl"></p><button onclick="start(G.lv)">REINTENTAR</button><button id="nx">SIGUIENTE
            MISIÓN</button><button onclick="show('menu')">MENÚ</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const $ = id => document.getElementById(id), cv = $('c'), clamp = (v, a, b) => Math.max(a, Math.min(b, v));

            {n: 'Zona industrial', sky: 0x3a3f4a, fog: 50, size: 60, boxes: 34, enemies: 14, speed: 3.2, dmg: 8, hp: 80, col: 0x555a60},
            {n: 'Operación nocturna', sky: 0x0a0e1a, fog: 32, size: 70, boxes: 46, enemies: 22, speed: 3.8, dmg: 10, hp: 100, col: 0x2a3340}];
        const WEAPONS = [

            {n: 'AK-47', dmg: 22, rate: .09, mag: 30, res: 120, spr: .025, pel: 1, rl: 1.8, auto: true, col: 0x5a3a1a, len: .8},
            {n: 'ESCOPETA', dmg: 14, rate: .9, mag: 6, res: 30, spr: .07, pel: 8, rl: 2.2, auto: false, col: 0x222222, len: .9},
            {n: 'FRANCOTIRADOR', dmg: 110, rate: 1.2, mag: 5, res: 20, spr: .002, pel: 1, rl: 2.5, auto: false, col: 0x1a2a1a, len: 1.1, zoom: 3}];
        const R = new THREE.WebGLRenderer({canvas: cv, antialias: true}), S = new THREE.Scene(), cam = new THREE.PerspectiveCamera(75, 1, .1, 200), RC = new THREE.Raycaster();
        R.setPixelRatio(Math.min(devicePixelRatio, 2)); S.add(cam); cam.rotation.order = 'YXZ';
        function rs() {R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix()} addEventListener('resize', rs); rs();
        let G = {state: 'menu'}, world, solids = [], solidM = [], enemies = [], tr = [], vm, mf, yaw = 0, pitch = 0, vy = 0, ground = true, ads = false, fire = false, kick = 0, bob = 0, dmgA = 0, hmA = 0, seed = 1;
        const k = {}, W = () => WEAPONS[G.w], rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
        /* AUDIO */
        let AC; function snd(f, d, v = .2) {try {AC = AC || new AudioContext(); const b = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++)a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / a.length, 3); const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); fl.frequency.value = f; g.gain.value = v; s.buffer = b; s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start()} catch (e) { } }
        /* MUNDO */

        function build(i) {

            const f = new THREE.Mesh(new THREE.PlaneGeometry(L.size, L.size), new THREE.MeshLambertMaterial({color: L.col})); f.rotation.x = -Math.PI / 2; world.add(f);

        }

            mf = new THREE.Mesh(new THREE.BoxGeometry(.14, .14, .02), new THREE.MeshBasicMaterial({color: 0xffcc55})); mf.position.z = -w.len - .03; mf.visible = false; vm.add(b, h, mf); vm.position.set(.22, -.2, -.35); cam.add(vm)
        }
        function sw(i) {if (i === G.w) return; G.w = i; G.rl = 0; setVM(); snd(700, .06, .15)}
        function reload() {const a = G.ammo[G.w], w = W(); if (G.rl > 0 || a.mag >= w.mag || a.res <= 0) return; G.rl = w.rl; snd(500, .1, .2)}
        function tracer(a, b, c) {const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({color: c})); S.add(l); tr.push({l, t: .07})}
        function shoot() {
            const w = W(), a = G.ammo[G.w]; if (G.cd > 0 || G.rl > 0) return; if (a.mag <= 0) {reload(); return }
            a.mag--; G.cd = w.rate; kick = 1; mf.visible = true; snd(w.pel > 1 ? 900 : 1800, .18, .35); cam.updateMatrixWorld(); const o = cam.getWorldPosition(new THREE.Vector3()), T = solidM.concat(enemies.map(e => e.g));
            for (let p = 0; p < w.pel; p++) {
                const sp = w.spr * (ads ? .3 : 1) * (k.KeyW || k.KeyS || k.KeyA || k.KeyD ? 1.8 : 1), d = new THREE.Vector3((Math.random() - .5) * sp * 2, (Math.random() - .5) * sp * 2, -1).transformDirection(cam.matrixWorld);
                RC.set(o, d); RC.far = 150; const h = RC.intersectObjects(T, true)[0], end = h ? h.point : o.clone().addScaledVector(d, 80); tracer(o.clone().addScaledVector(d, .8).add(new THREE.Vector3(0, -.15, 0)), end, 0xffdd88);
                if (h) {let e = h.object; while (e && !e.userData.e) e = e.parent; if (e) dmgE(e.userData.e, w.dmg * (h.object.name === 'head' ? 2.5 : 1), h.object.name === 'head')}
            }
            pitch += w.pel > 1 ? .04 : .012; if (a.mag === 0) reload()

        function hurt(d) {G.hp -= d; G.last = G.t; dmgA = 1; snd(150, .15, .3); if (G.hp <= 0) end(false)}
        /* ENEMIGOS */
        function spawn() {
            const L = LEVELS[G.lv], s = L.size / 2 - 3; for (let t = 0; t < 40; t++) {
                const x = (Math.random() * 2 - 1) * s, z = (Math.random() * 2 - 1) * s; if (Math.hypot(x - cam.position.x, z - cam.position.z) < 18 || solids.some(b => x > b.minX - .8 && x < b.maxX + .8 && z > b.minZ - .8 && z < b.maxZ + .8)) continue;
                const g = new THREE.Group(), m = c => new THREE.MeshLambertMaterial({color: c}), P = (geo, c, x, y, z) => {const q = new THREE.Mesh(geo, m(c)); q.position.set(x, y, z); g.add(q); return q};
                P(new THREE.BoxGeometry(.6, .9, .35), 0x7a2a2a, 0, 1, 0); P(new THREE.BoxGeometry(.5, .6, .3), 0x2a2a2a, 0, .3, 0); P(new THREE.SphereGeometry(.18, 10, 8), 0xd9a77a, 0, 1.65, 0).name = 'head'; P(new THREE.BoxGeometry(.06, .06, .6), 0x111111, .3, 1.2, .3);

                if (d > 9) {p.x += dx / d * L.speed * dt; p.z += dz / d * L.speed * dt} else {const s = Math.sin(G.t + e.ph) * 1.6 * dt; p.x += dz / d * s; p.z -= dx / d * s} collide(p, .45);
                e.cd -= dt; if (e.cd <= 0 && d < 40) {

                }
            }
        }
        /* ESTADO */

        function cards() {let u = 0; try {u = +localStorage.ip || 0} catch (e) { } $('cards').innerHTML = ''; LEVELS.forEach((L, i) => {const d = document.createElement('div'); d.className = 'card' + (i > u ? ' lock' : ''); d.innerHTML = `<h3>${i + 1}. ${L.n}</h3><p>${L.enemies} enemigos</p><p>${i > u ? '🔒 Bloqueada' : 'Disponible'}</p>`; if (i <= u) d.onclick = () => start(i); $('cards').appendChild(d)})}
        function start(i) {G = {state: 'play', lv: i, w: 1, kills: 0, hp: 100, ammo: WEAPONS.map(w => ({mag: w.mag, res: w.res})), cd: 0, rl: 0, spawned: 0, st: 0, last: 0, score: 0, t: 0}; build(i); setVM(); yaw = pitch = 0; fire = ads = false; cam.position.set(0, 1.7, 0); show(null); cv.requestPointerLock()}

            const nx = win && G.lv < LEVELS.length - 1; if (win) try {localStorage.ip = Math.max(+localStorage.ip || 0, G.lv + 1)} catch (e) { } $('nx').style.display = nx ? '' : 'none'; $('nx').onclick = () => start(G.lv + 1); show('end')

            enemyAI(dt); if (G.state === 'play' && G.kills >= L.enemies) end(true);
            const tf = ads ? (w.zoom ? 75 / w.zoom : 55) : 75; cam.fov += (tf - cam.fov) * Math.min(1, dt * 12); cam.updateProjectionMatrix();

            $('hpb').style.width = G.hp + '%'; $('hpb').style.background = G.hp < 35 ? '#e33' : '#7fdc3a'; $('top').textContent = `BAJAS ${G.kills}/${L.enemies}  ·  ${G.score} PTS`;
            $('ammo').innerHTML = `${a.mag} / ${a.res}<small>${G.rl > 0 ? 'RECARGANDO…' : w.n} ${WEAPONS.map((x, i) => i === G.w ? `[${i + 1}]` : i + 1).join(' ')}</small>`

        show('menu');
    </script>

    <footer id="pie-david"><span>Creado por David Camacho</span><span>·</span><a
            href="https://1dam-dcamper062.github.io/Juegos/">&larr; Volver al inicio</a></footer>
    <script>
        /* ===== Controles táctiles (joystick flotante + botones) ===== */
        (function () {
            function TouchUI(o) {
                let on = matchMedia('(pointer:coarse)').matches, built = false, shown = false;
                let tc, zone, ui, bs, ks, ba, ka, hint;
                const st = {s: null, a: null, l: null}, pressed = new Set();
                const rad = () => Math.min(innerWidth, innerHeight) * .13;
                const mk = (p, c, h) => {const e = document.createElement('div'); e.className = c; if (h) e.innerHTML = h; p.appendChild(e); return e};
                const vec = (s, t) => {
                    const R = rad(); let dx = t.clientX - s.ox, dy = t.clientY - s.oy; const d = Math.hypot(dx, dy);
                    if (d > R) {dx *= R / d; dy *= R / d}
                    let m = Math.min(1, d / R); if (m < .12) return {x: 0, y: 0, m: 0, dx, dy};
                    return {x: dx / R, y: dy / R, m, dx, dy};
                };
                const place = (base, knob, x, y) => {base.style.left = x + 'px'; base.style.top = y + 'px'; base.style.display = 'block'; knob.style.transform = 'translate(0,0)'};
                const hide = (base, knob) => {base.style.display = 'none'; knob.style.transform = 'translate(0,0)'};

                function build() {
                    built = true;
                    const css = document.createElement('style');
                    css.textContent = `
body{touch-action:manipulation}
.tc{position:fixed;inset:0;z-index:60;display:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,Arial,sans-serif}
.tc.on{display:block}
.tcz{position:absolute;inset:0;touch-action:none}
.tcu{position:absolute;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);pointer-events:none}
.tcb{position:absolute;display:none;width:26vmin;height:26vmin;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);transform:translate(-50%,-50%);pointer-events:none}
.tck{position:absolute;left:50%;top:50%;width:11vmin;height:11vmin;margin:-5.5vmin 0 0 -5.5vmin;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7)}
.tcbtn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:700;letter-spacing:.03em;touch-action:none;box-sizing:border-box;text-shadow:0 1px 3px #000;text-align:center;line-height:1}
.tcbtn.pill{border-radius:99px}
.tcbtn.p{background:rgba(255,255,255,.4);transform:scale(.93)}
.tchint{position:fixed;left:8%;right:8%;top:36%;display:none;text-align:center;padding:14px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;font:600 16px/1.4 system-ui,sans-serif;pointer-events:none}`;
                    document.head.appendChild(css);
                    tc = mk(document.body, 'tc'); zone = mk(tc, 'tcz');
                    bs = mk(tc, 'tcb'); ks = mk(bs, 'tck'); ba = mk(tc, 'tcb'); ka = mk(ba, 'tck');
                    ui = mk(tc, 'tcu');
                    hint = mk(tc, 'tchint', '📱 Gira el móvil en horizontal para jugar mejor');

                    zone.addEventListener('touchstart', e => {
                        e.preventDefault();
                        for (const t of e.changedTouches) {
                            const left = t.clientX < innerWidth / 2;
                            const R = rad(), ox = Math.max(R + 6, Math.min(innerWidth - R - 6, t.clientX)), oy = Math.max(R + 6, Math.min(innerHeight - R - 30, t.clientY));
                            if (left) {
                                if (!st.s) {st.s = {id: t.identifier, ox, oy}; place(bs, ks, ox, oy); o.stick && o.stick(0, 0, 0)}
                            } else if (o.aim) {
                                if (!st.a) {st.a = {id: t.identifier, ox, oy}; place(ba, ka, ox, oy); o.aim(0, 0, 0, true)}
                            } else if (!st.l) st.l = {id: t.identifier, lx: t.clientX, ly: t.clientY};
                        }
                    }, {passive: false});

                    zone.addEventListener('touchmove', e => {
                        e.preventDefault();
                        for (const t of e.changedTouches) {
                            if (st.s && t.identifier === st.s.id) {const v = vec(st.s, t); ks.style.transform = `translate(${v.dx}px,${v.dy}px)`; o.stick && o.stick(v.x, v.y, v.m)}
                            else if (st.a && t.identifier === st.a.id) {const v = vec(st.a, t); ka.style.transform = `translate(${v.dx}px,${v.dy}px)`; o.aim(v.x, v.y, v.m, true)}
                            else if (st.l && t.identifier === st.l.id) {o.look && o.look(t.clientX - st.l.lx, t.clientY - st.l.ly); st.l.lx = t.clientX; st.l.ly = t.clientY}
                        }
                    }, {passive: false});

                    const end = e => {
                        e.preventDefault();
                        for (const t of e.changedTouches) {
                            if (st.s && t.identifier === st.s.id) {st.s = null; hide(bs, ks); o.stick && o.stick(0, 0, 0)}
                            else if (st.a && t.identifier === st.a.id) {st.a = null; hide(ba, ka); o.aim(0, 0, 0, false)}
                            else if (st.l && t.identifier === st.l.id) st.l = null;
                        }
                    };
                    zone.addEventListener('touchend', end, {passive: false}); zone.addEventListener('touchcancel', end, {passive: false});

                    (o.buttons || []).forEach(b => {
                        const s = b.size, fs = b.fs || s * .34;
                        const e = mk(ui, 'tcbtn' + (b.pill ? ' pill' : ''), b.txt); b._e = e;
                        e.style.cssText = b.pos + ';' + (b.pill
                            ? `height:${s}vmin;min-width:${s}vmin;padding:0 ${s * .3}vmin;font-size:${fs}vmin`
                            : `width:${s}vmin;height:${s}vmin;font-size:${fs}vmin`);
                        let id = null;
                        e.addEventListener('touchstart', ev => {
                            ev.preventDefault(); if (id !== null) return; id = ev.changedTouches[0].identifier; e.classList.add('p');
                            b.down && b.down(); if (b.up) pressed.add(b);
                        }, {passive: false});
                        const rel = ev => {
                            ev.preventDefault();
                            for (const t of ev.changedTouches) if (t.identifier === id) {id = null; e.classList.remove('p'); if (pressed.delete(b)) b.up && b.up()}
                        };
                        e.addEventListener('touchend', rel, {passive: false}); e.addEventListener('touchcancel', rel, {passive: false});
                    });
                    window.__touch = true;
                    o.onEnable && o.onEnable();
                }

                function releaseAll() {
                    st.s = st.a = st.l = null; hide(bs, ks); hide(ba, ka);
                    o.stick && o.stick(0, 0, 0); o.aim && o.aim(0, 0, 0, false);
                    pressed.forEach(b => {b._e.classList.remove('p'); b.up && b.up()}); pressed.clear();
                    (o.buttons || []).forEach(b => b._e && b._e.classList.remove('p'));
                }

                addEventListener('touchstart', () => {on = true}, {once: true, passive: true});
                (function tick() {
                    requestAnimationFrame(tick); if (!on) return; if (!built) build();
                    const a = !!o.active();
                    if (a !== shown) {shown = a; tc.classList.toggle('on', a); if (!a) releaseAll()}
                    if (shown) hint.style.display = innerHeight > innerWidth ? 'block' : 'none';
                })();
            }
            window.TouchUI = TouchUI;
        })();

        /* ===== Controles táctiles: Krunker ===== */
        /* En móvil no existe Pointer Lock: lo dejamos como "no-op" para que el juego no falle */
        if (!HTMLElement.prototype.requestPointerLock) HTMLElement.prototype.requestPointerLock = function () { };
        if (!document.exitPointerLock) document.exitPointerLock = function () { };
        /* iOS/Android: desbloquear el audio con el primer toque */
        ['touchend', 'click'].forEach(ev => addEventListener(ev, () => {try {AC = AC || new AudioContext(); if (AC.state === 'suspended') AC.resume()} catch (e) { } }, {passive: true}));
        (function () {
            const wb = [0, 1, 2, 3].map(i => ({txt: String(i + 1), pill: 1, size: 9, pos: `left:calc(50% - 20vmin + ${i * 10}vmin);top:14vmin`, down() {if (G.state === 'play') sw(i)} }));
            TouchUI({
                active: () => G.state === 'play',
                stick: (x, y, m) => {k.KeyD = x > .35; k.KeyA = x < -.35; k.KeyS = y > .35; k.KeyW = y < -.35; k.ShiftLeft = m > .9},
                look: (dx, dy) => {const s = .0055 * (ads ? (W().zoom ? .25 : .6) : 1); yaw -= dx * s; pitch = clamp(pitch - dy * s, -1.5, 1.5)},
                buttons: [
                    {txt: 'FUEGO', size: 21, fs: 4.2, pos: 'right:5vmin;bottom:26vmin', down() {fire = true; if (!W().auto) shoot()}, up() {fire = false} },
                    {txt: 'SALTO', size: 15, fs: 3.4, pos: 'right:28vmin;bottom:26vmin', down() {k.Space = true}, up() {k.Space = false} },
                    {txt: 'MIRA', size: 13, fs: 3, pos: 'right:6vmin;bottom:50vmin', down() {ads = !ads} },
                    {txt: 'R', size: 12, fs: 4.5, pos: 'right:23vmin;bottom:46vmin', down() {if (G.state === 'play') reload()} },
                    {txt: 'II', pill: 1, size: 8, pos: 'right:2vmin;top:2vmin', down() {if (G.state === 'play') {G.state = 'pause'; fire = false; show('pause')} } }
                ].concat(wb),
                onEnable() {
                    const c = document.querySelector('#ctl .ctl');
                    if (c) c.innerHTML = 'Joystick izquierdo mover (al borde = correr)<br>Arrastra la mitad derecha para apuntar<br>FUEGO · SALTO · MIRA (zoom) · R recargar<br>1-4 cambiar arma · II pausa';
                }
            });
        })();

    </script>
